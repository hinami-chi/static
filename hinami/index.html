<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>overlay</title>
</head>

<body>
    <div id="bgwparrer">
        <img src="" id="bg">
        <div id="bgDark"></div>
    </div>
    <div id="wrapper">

        <div id="sb">
            <div id="sbBg">
                <img src="skin/scorebar-bg.png" />
            </div>
            <div id="sbColor">
                <img src="skin/scorebar-colour.png" />
            </div>
        </div>

        <div id="nowPlaying">NP:</div>
        
        <div id="score"></div>

        <!-- <div id="map">
            <div class="mapdata-container">
                <div id="mapdata" class="mapdata-text"></div>
            </div>
        </div> -->

        <div id="acc">
            <div id="accdata">0</div>
        </div>

        <div id="timer"></div>
       
        <div id="rank"></div>
        <div id="mods"></div>
        <div id="combo">
            <div id="combodata">0</div>
        </div>

        <!-- hits --> 
        <div id="hits">
            <div id="hits300" class="hit-stat">
                <span class="hit-count">0</span>
                <span class="hit-label">300s</span>
            </div>
            <div id="hits100" class="hit-stat">
                <span class="hit-count">0</span>
                <span class="hit-label">100s</span>
            </div>
            <div id="hits50" class="hit-stat">
                <span class="hit-count">0</span>
                <span class="hit-label">50s</span>
            </div>
            <div id="hitsSB" class="hit-stat">
                <span class="hit-count">0</span>
                <span class="hit-label">SB</span>
            </div>
            <div id="hitsMiss" class="hit-stat">
                <span class="hit-count">0</span>
                <span class="hit-label">Miss</span>
            </div>
        </div>

        <div id="leaderboard" class="leaderboard" aria-live="polite" style="display:block;">
            <div id="leaderboard-players" class="leaderboard-list" role="list">
                <div id="leader-template" class="leader-name template" aria-hidden="true">
                    <div class="player-meta">
                        <div class="player-title-container">
                            <div class="player-title">Player name</div>
                        </div>
                        <div class="player-score-container">
                            <span class="player-score">0</span>
                        </div>
                    </div>
                    <div class="player-right">
                        <div class="player-pos-container">
                            <span class="player-pos">#00</span>
                        </div>
                        <div class="player-combo-container">
                            <span class="player-combo">0x</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="pp">
            <div id="ppCurent" class="odometer ppNum">0</div>
            --> <div id="ppIfFc" class="odometer ppNum">0</div> 
            <div class="ppText">pp<div>
        </div>

        <div id="bpm">
            <div id="bpmdata">0</div>
        </div>
	<!--
        <div id="ur" class="monoespaciado">
            0
        </div>
	-->
        <div id="star">
            <div id="starStat">0</div>
        </div>

        <div id="cs">
            <div id="csStat">0</div>
        </div>

        <div id="ar">
            <div id="arStat">0</div>
        </div>


        <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
        <script src="deps/countUp.js"></script>
        <script src="deps/reconnecting-websocket.min.js"></script>
        <script src="index.js"></script>
    </div>
</body>

</html>
